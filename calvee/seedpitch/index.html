,{state:`recall`,text:`copied the answer from the next desk.`},{state:`ok`,text:`can explain it to a classmate.`}],figures:[{value:`24.69 Cr`,label:`school students in India`,basis:`deck`,from:`UDISE+ 2024-25`},{value:`14.71 L`,label:`schools in India`,basis:`deck`,from:`UDISE+ 2024-25`},{value:`39%`,label:`of students are in private schools, the highest share since 2018-19`,basis:`deck`,from:`UDISE+ 2024-25`}]},Vs={title:`Why we are here`,lead:`Twelve things that are true in almost every classroom today.`,groups:[{name:`In the classroom`,items:[{head:`One teaching personality meets up to sixteen kinds of learner.`,body:`A class of 40 holds many ways of thinking. One teacher can teach in one way at a time.`},{head:`In a group, students are trained to say yes.`,body:`Nobody tracks what each student learned. The class moves on when the room nods.`},{head:`Nobody can tell where a student is stuck.`,body:`Is it understanding the idea, or remembering it later? The two need different help, and a mark sheet shows neither.`}]},{name:`In the material`,items:[{head:`The facts and the method are more than ten years old.`,body:`Examples are printed once and taught for a decade.`},{head:`Students and teachers already use AI. The pedagogy has not changed.`,body:`New tools are being used to do the old homework faster.`},{head:`Subjects are split by force.`,body:`Maths, science and language are taught as if they never meet, so students cannot relate one to the other.`},{head:`Video lessons are as fixed as print.`,body:`A recording explains one way, to everyone, every time it is played.`}]},{name:`In the system`,items:[{head:`Education is the last sector to adopt frontier technology.`,body:`It should be the first. Everything else is built by the people it teaches.`},{head:`Teachers cannot be updated in real time.`,body:`No training calendar can keep pace with what changes each month.`}]},{name:`After school`,items:[{head:`Students practise the skills that AI now does without help.`,body:`They are not being prepared for the work that will be left for people.`},{head:`Students have to work it out alone.`,body:`With no guide, they follow whatever industry is hiring that year.`},{head:`The gap between what industry needs and what is taught is not measured.`,body:`It covers the method and the subjects. Nobody has put a number on it.`}]}]},Hs=[{aspect:`The numbers`,page:`Printed once. The student cannot change them.`,calvee:`The student changes the value and runs it. A wrong value fails in front of them.`},{aspect:`The formula`,page:`Stated in a box, then used.`,calvee:`Fills in with the numbers on screen while the scene plays.`},{aspect:`The check`,page:`Exercises at the end of the chapter, marked days later.`,calvee:`Every student answers at the desk. The teacher sees who is wrong and sure, by name, in the same minute.`}],Us={title:`The same chapter adapted to 40 students`,lead:`On the left, the chapter as it is printed. On the right, the same chapter in CALVEE.`,pageLabel:`On the printed page`,liveLabel:`In CALVEE`,printNote:`Redrawn in the style of a printed page. Save a screenshot of the real page as book/{id}.jpg and it appears here.`,items:[{id:`motion`,tab:`Motion`,chapter:`Science · Class 9 · Motion`,book:`NCERT Science, Class 9`,print:{heading:`Motion with uniform acceleration`,paragraphs:[`When the velocity of an object changes by equal amounts in equal intervals of time, the object is said to move with uniform acceleration. Its velocity–time graph is a straight line.`,`For such motion, the initial velocity u, final velocity v, acceleration a, time t and distance s are related by three equations.`],equations:[`v = u + at`,`s = ut + ½ at²`,`v² = u² + 2as`],example:`Example. A car moving at 20 m/s is brought to rest in 5 s by applying the brakes. Find the distance it travels in this time.`,working:[`u = 20 m/s, v = 0, t = 5 s`,`a = (v − u) ÷ t = −4 m/s²`,`s = ut + ½ at² = 100 − 50 = 50 m`],figure:`graph`,figureCaption:`Fig. Velocity–time graph of a car that slows down`},live:{question:`When must the engines start?`,anchor:`Starship caught by its launch tower, 14 Nov 2026`},rows:[{aspect:`The example`,page:`A car that brakes. The same car for every student, every year.`,calvee:`A rocket caught by its tower this month. It is replaced when the news changes.`},...Hs]},{id:`trig`,tab:`Trigonometry`,chapter:`Mathematics · Class 10 · Some applications of trigonometry`,book:`NCERT Mathematics, Class 10`,print:{heading:`Heights and distances`,paragraphs:[`The line drawn from the eye of an observer to a point on the object is called the line of sight. The angle it makes with the horizontal, when the point is above eye level, is the angle of elevation.`,`If one side and one acute angle of a right triangle are known, the other sides can be found with trigonometric ratios.`],equations:[`sin θ = opposite ÷ hypotenuse`,`cos θ = adjacent ÷ hypotenuse`,`tan θ = opposite ÷ adjacent`],example:`Example. From a point on the ground 50 m from the foot of a tower, the angle of elevation of its top is 30°. Find the height of the tower.`,working:[`tan 30° = height ÷ 50`,`height = 50 × 1⁄√3`,`height = 28.9 m`],figure:`triangle`,figureCaption:`Fig. A tower seen from a point on the ground`},live:{question:`How tall is the statue?`,anchor:`The Statue of Unity, seen from 500 m away`},rows:[{aspect:`The example`,page:`A tower and a point on the ground. The triangle never moves.`,calvee:`The Statue of Unity, in the news on 31 October. The student tilts the sight line and the height follows.`},...Hs]},{id:`fractions`,tab:`Fractions`,chapter:`Mathematics · Class 6 · Fractions`,book:`NCERT Ganita Prakash, Class 6`,print:{heading:`Equivalent fractions`,paragraphs:[`Fractions that stand for the same part of a whole are called equivalent fractions. They look different and have the same value.`,`An equivalent fraction is found by multiplying or dividing the numerator and the denominator by the same number.`],equations:[`1⁄2 = 2⁄4 = 3⁄6`,`6⁄8 = (6 ÷ 2)⁄(8 ÷ 2) = 3⁄4`],example:`Example. Write 12⁄18 in its simplest form.`,working:[`6 divides 12 and 18`,`12 ÷ 6 = 2, 18 ÷ 6 = 3`,`12⁄18 = 2⁄3`],figure:`strip`,figureCaption:`Fig. One half and two quarters of the same strip`},live:{question:`Is 10 out of 15 the same as 2 out of 3?`,anchor:`A box of 15 Diwali laddus, 10 still left`},rows:[{aspect:`The example`,page:`A shaded strip. The student is told the two parts are equal.`,calvee:`A box of laddus a week after Diwali. The student sorts the 15 places into groups and finds which group size works.`},...Hs]}]},Ws={title:`Introducing CALVEE`,lead:`An adaptive classroom. The teacher leads from a console, the class shares one smart board, and every student has a screen on the desk.`,pairs:[{today:`One explanation for forty students`,calvee:`The model changes the example and the explanation to fit each student’s learner profile.`},{today:`The room says yes`,calvee:`Every student answers alone at the desk and says how sure they are. The board shows counts. Only the teacher sees names.`},{today:`Understanding or memory? Nobody knows`,calvee:`Wrong and sure means the idea was misunderstood. Right today and wrong next week means it was not retained. CALVEE tells the two apart and treats each one.`},{today:`Ten-year-old examples`,calvee:`Each concept opens on a dated, sourced event from the news, approved by a teacher.`},{today:`Subjects kept apart`,calvee:`Every module has a task that links the idea to another subject, and a task that uses it on a real problem.`},{today:`Teachers updated by training calendars`,calvee:`The console tells the teacher what to do in each step and which students need them now.`}],layers:{value:`3`,label:`layers in every module: syllabus, technology, workforce`,basis:`deck`},screens:[{img:`img/screen-teacher.jpg`,name:`Teacher console`,text:`Leads the lesson. Sees every answer with the student’s name.`},{img:`img/screen-board.jpg`,name:`Smart board`,text:`The scene for the whole class. Counts only, never names.`},{img:`img/screen-desk.jpg`,name:`Student desk`,text:`The student’s own model, questions and six kinds of task.`}],evidence:{title:`Adaptive teaching has been measured`,text:`In an independent trial of Mindspark in Delhi, 619 students in grades 6 to 9 used adaptive software for about 4.5 months.`,figures:[{value:`+0.37 SD`,label:`gain in maths`,basis:`deck`,from:`J-PAL`},{value:`+0.23 SD`,label:`gain in Hindi`,basis:`deck`,from:`J-PAL`}],caution:`This is a result for Mindspark. It is not a CALVEE result.`}},Gs={title:`Where CALVEE stands today`,traction:[{value:`2`,label:`MOUs signed: TNAU (Tamil Nadu) and GHUMPA (Karnataka)`,basis:`deck`,from:``},{value:`2 states`,label:`in talks: the Karnataka and Tamil Nadu education departments`,basis:`deck`,from:``}],items:[{name:`Syllabus covered`,text:`CBSE, from the NCERT textbooks for Classes 5 to 12, and Cambridge IGCSE, from the Cambridge International syllabuses.`,detail:[`NCERT: Math-Mela, Ganita Prakash, Ganita Manjari, Mathematics, Curiosity, Exploration, Science`,`Cambridge IGCSE: Mathematics 0580, Physics 0625, Chemistry 0620, Biology 0610, Computer Science 0478, Accounting 0452, Additional Mathematics 0606, Business Studies 0450, Co-ordinated Sciences (Double) 0654, Combined Science 0653, Economics 0455, English as a Second Language 0510, Environmental Management 0680, First Language English 0500, Geography 0460, Global Perspectives 0457, Hindi as a Second Language 0549, History 0470, Information and Communication Technology 0417, International Mathematics 0607, Sanskrit 0499, Statistics 0479`]},{name:`Adaptive pedagogy`,text:`The model changes the examples and the explanation to fit each student’s learner profile: what they already know, how sure they are, how fast they read, what interests them.`,detail:[]},{name:`Silent personality capture`,text:`Students are grouped by how they behave and perform in class. There is no separate personality quiz to sit. It runs with school and parent consent.`,detail:[]},{name:`Skill Port`,text:`Connects eligible students with brands and organisations that need what those students can do.`,detail:[]},{name:`On-premises option`,text:`The model can run on a box inside the school, so a classroom keeps working with no internet.`,detail:[]}],streamsTitle:`The model is ready for nine fields`,streams:[`Literature`,`Agriculture`,`Programming technology`,`Technology manufacturing`,`Space science`,`Automotive`,`Design and psychology`,`Marketing`,`Healthcare`]},Ks={caption:`Brands that can reach Skill Port students through their tech agencies`,items:[{name:`Amaron`,logo:`brands/amaron.png`},{name:`Burger King (Bahrain)`,logo:`brands/burger-king.webp`},{name:`Miniso (Bahrain)`,logo:`brands/miniso.svg`}]},qs={title:`The market`,lead:`Counts come from government surveys and named research firms. Where a figure is our own estimate, it is tagged.`,funnel:[{tier:`TAM`,measure:`Market value`,value:`₹23,400 Cr`,small:`US$2.8 B`,label:`India edtech market in 2024. Forecast ₹2.78 L Cr (US$33.2 B) by 2033, growing 28.7% a year`,basis:`deck`,from:`IMARC`},{tier:`SAM`,measure:`Students`,value:`2.43 Cr`,small:``,label:`school students in Karnataka (1.18 Cr) and Tamil Nadu (1.25 Cr)`,basis:`deck`,from:`UDISE+ 2024-25`},{tier:`SOM`,measure:`Schools`,value:`19,105`,small:``,label:`private unaided schools in Karnataka, with 56.6 L students`,basis:`deck`,from:`UDISE+, via Deccan Herald`}],otherEstimates:`Other firms put India edtech in 2024 between ₹36,000 Cr and ₹62,800 Cr (US$4.3 B to US$7.5 B). Dollar figures are converted at ₹83.7 to the dollar, the 2024 average.`,segments:[{name:`Private schools`,value:`3,39,583`,label:`private unaided schools in India`,basis:`source`,from:`UDISE+ 2024-25`},{name:`International schools`,value:`972`,label:`international schools in India, the second largest count of any country`,basis:`source`,from:`ISC Research, Jan 2025`},{name:`Private colleges`,value:`32,513`,label:`private unaided colleges, 70% of all colleges`,basis:`source`,from:`AISHE 2023-24`},{name:`Universities`,value:`1,289`,label:`universities registered in India`,basis:`source`,from:`AISHE 2023-24`},{name:`Government`,value:`1,36,382`,label:`smart classrooms approved for government schools, 2021-22 to 2025-26`,basis:`source`,from:`Ministry of Education, Samagra Shiksha`}],classroomMath:[{value:`1.4 L`,label:`classrooms of 40 in Karnataka’s private unaided schools (56.6 L students ÷ 40)`,basis:`estimate`,from:``},{value:`₹11,037 Cr`,label:`one-time value if every one of them were equipped at ₹7.8 L`,basis:`estimate`,from:``},{value:`₹110 Cr`,label:`one-time value of 1% of them, about 1,415 classrooms`,basis:`estimate`,from:``}],readiness:{years:[`2023-24`,`2024-25`],from:`UDISE+, via ThePrint`,items:[{label:`Schools with internet`,before:53.9,after:63.5},{label:`Schools with computers`,before:57.2,after:64.7}]}},Js={title:`One classroom`,price:{value:`₹7.8 L`,label:`per classroom of 40, one time: equipment, assembly and training`,basis:`given`},billing:`Then a subscription for model use: an estimated ₹7,000 per classroom each month, based on usage.`,recommendTitle:`What goes into a classroom`,recommend:[`Every desk has a tablet-size 2K touchscreen with its own processor, set flat into the desk top. Each desk draws its own 3D scene.`,`One classroom box keeps the class in step, stores the lessons, and can run the model with no internet.`,`A smart board for the whole class and a console for the teacher.`,`If one desk unit fails, one student moves seats and the class carries on.`],costTitle:`What a classroom costs us`,costNote:`All cost figures are estimates from public list prices in November 2026, before GST. They need supplier quotes before they are used in a term sheet.`,lines:[{item:`40 desk units`,note:`2K touchscreen with its own processor, assembled by us at ₹6,000 each`,bought:36e4,assembled:24e4},{item:`Desk mounts, power and cabling`,note:`₹600 a seat, fitted to existing furniture`,bought:24e3,assembled:
